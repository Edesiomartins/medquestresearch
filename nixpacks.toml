[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]

# Na fase de build, garantir que backend/requirements.txt exista
# Isso resolve o problema do Railway tentar instalar de backend/requirements.txt
[phases.build]
cmds = [
  "mkdir -p backend || true",
  "cp requirements.txt backend/requirements.txt || true",
  "pip install -r backend/requirements.txt || pip install -r requirements.txt"
]

# [start] removido: o Dockerfile já define CMD. O cmd com "cd" quebra no Railway
# porque "cd" não é executável. Usar builder DOCKERFILE e CMD do Dockerfile.
