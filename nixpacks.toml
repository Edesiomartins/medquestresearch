[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]

# Fase de build vazia para evitar que o Railway tente instalar de backend/requirements.txt
[phases.build]
cmds = []

[start]
cmd = "cd backend && uvicorn api:app --host 0.0.0.0 --port $PORT"
