services:
  - type: web
    name: medquest-research-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: API_OPENAI_KEY_RESEARCH
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESEARCH_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production

