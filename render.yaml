services:
  - type: web
    name: medquest-research-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn api:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # DATABASE_URL é fornecido automaticamente pelo Render quando você conecta um banco PostgreSQL
      # Não precisa configurar manualmente - o Render faz isso automaticamente
      - key: API_OPENAI_KEY_RESEARCH
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESEARCH_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production

